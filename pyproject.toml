[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisquant"
version = "0.0.1"
description = "Regime-aware quantitative research and portfolio management platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
    "types-PyYAML==6.0.12.20260815",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "backtesting*",
    "config*",
    "data_pipeline*",
    "execution_engine*",
    "feature_engineering*",
    "monte_carlo*",
    "multi_agent*",
    "portfolio_optimization*",
    "regime_detection*",
    "representation_learning*",
    "risk_engine*",
    "services*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
config = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
packages = [
    "backtesting",
    "config",
    "data_pipeline",
    "execution_engine",
    "feature_engineering",
    "monte_carlo",
    "multi_agent",
    "portfolio_optimization",
    "regime_detection",
    "representation_learning",
    "risk_engine",
    "services",
]
