name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.18.0-pg17
        env:
          POSTGRES_DB: aegisquant_test
          POSTGRES_USER: aegisquant
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisquant -d aegisquant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AEGISQUANT_ENV: dev
      AEGISQUANT_DATABASE_URL: postgresql+psycopg://aegisquant:ci-only-password@127.0.0.1:5432/aegisquant_test
      POSTGRES_PASSWORD: ci-compose-only-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --constraint constraints.lock ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check
        run: python -m mypy

      - name: Verify empty migration history against TimescaleDB
        run: python -m alembic upgrade head

      - name: Test
        run: python -m pytest

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build health service image
        run: docker build --file infra/docker/health-service.Dockerfile --tag aegisquant-health:ci .
